project:
  type: website
  output-dir: docs
  render:
    - "**/*.qmd"
    - "!docs/**"
    - "!_freeze/**"
    - "!files/templates/*.qmd"
    - "!assignment/data/pres-ejemplo.qmd"
    - "!assignment/pres-ejemplo/**"
    - "!trabajos/informe1/grupo*/**"
    - "!trabajos/informe-final/grupo-*/*/**"
    - "!assignment/sin_usar/**"
    - "!slides/sin_usar/**"
  resources:
    - "files/"
    - "projects/"
    - "slides/*.html"
    - "slides/*.pdf"
    - "slides/img/"
    - "slides/images/"
    - "slides/libs/"
    - "slides/css/"
    - "slides/*_files/"
    - "slides/*_files/figure-html"
    - "CNAME"

# See https://quarto.org/docs/projects/code-execution.html#freeze
execute:
  freeze: auto  # Re-render only when source changes

bibliography: files/bib/references.bib
csl: files/bib/chicago-author-date.csl
description-meta: "Estadística Correlacional"

