<svg xmlns="http://www.w3.org/2000/svg" width="680" height="450" viewBox="0 0 680 450" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Eliminación listwise frente a pairwise</title>
<desc>La misma base de seis casos con tres valores perdidos. Listwise elimina los casos incompletos y deja n igual a 3 en todas las correlaciones. Pairwise usa los casos disponibles para cada par de variables, con n de 4, 5 y 3.</desc>
<style>
text { font-family: "Helvetica Neue", Arial, sans-serif; text-anchor: middle; }
.t { font-size: 14px; fill: #2C2C2A; }
.th { font-size: 14px; font-weight: 500; fill: #2C2C2A; }
.ts { font-size: 12px; fill: #5F5E5A; }
.box { fill: #F1EFE8; stroke: #B4B2A9; stroke-width: 0.5; }
.tab { fill: none; stroke: #B4B2A9; stroke-width: 0.5; }
.na rect { fill: #FAECE7; stroke: #993C1D; stroke-width: 0.5; }
.na text { font-size: 12px; fill: #712B13; }
.res rect { fill: #E1F5EE; stroke: #0F6E56; stroke-width: 0.5; }
.res .th { fill: #085041; }
.res .ts { fill: #0F6E56; }
.strike { stroke: #D85A30; stroke-width: 1.5; }
.dim { opacity: 0.45; }
</style>
<line x1="340" y1="30" x2="340" y2="426" stroke="#888780" stroke-width="0.5" stroke-dasharray="4 4"/>

<rect class="box" x="40" y="30" width="290" height="56" rx="8"/>
<text class="th" x="185" y="53">Listwise (por lista)</text>
<text class="ts" x="185" y="72">Excluye casos incompletos</text>
<rect class="box" x="350" y="30" width="290" height="56" rx="8"/>
<text class="th" x="495" y="53">Pairwise (por pares)</text>
<text class="ts" x="495" y="72">Usa lo disponible por par</text>

<rect class="tab" x="55" y="106" width="260" height="196" rx="6"/>
<line x1="55" y1="134" x2="315" y2="134" stroke="#B4B2A9" stroke-width="0.5"/>
<text class="th" x="80" y="125">Caso</text><text class="th" x="140" y="125">Edad</text><text class="th" x="210" y="125">Ingreso</text><text class="th" x="280" y="125">Educ.</text>
<text class="t" x="80" y="153">1</text><text class="t" x="140" y="153">34</text><text class="t" x="210" y="153">520</text><text class="t" x="280" y="153">12</text>
<g class="dim"><text class="t" x="80" y="181">2</text><text class="t" x="140" y="181">45</text><text class="t" x="280" y="181">16</text></g>
<g class="na"><rect x="183" y="166" width="54" height="20" rx="4"/><text x="210" y="180">NA</text></g>
<text class="t" x="80" y="209">3</text><text class="t" x="140" y="209">28</text><text class="t" x="210" y="209">410</text><text class="t" x="280" y="209">14</text>
<g class="dim"><text class="t" x="80" y="237">4</text><text class="t" x="140" y="237">52</text><text class="t" x="280" y="237">10</text></g>
<g class="na"><rect x="183" y="222" width="54" height="20" rx="4"/><text x="210" y="236">NA</text></g>
<text class="t" x="80" y="265">5</text><text class="t" x="140" y="265">39</text><text class="t" x="210" y="265">680</text><text class="t" x="280" y="265">17</text>
<g class="dim"><text class="t" x="80" y="293">6</text><text class="t" x="140" y="293">61</text><text class="t" x="210" y="293">450</text></g>
<g class="na"><rect x="253" y="278" width="54" height="20" rx="4"/><text x="280" y="292">NA</text></g>
<line class="strike" x1="62" y1="176" x2="308" y2="176"/>
<line class="strike" x1="62" y1="232" x2="308" y2="232"/>
<line class="strike" x1="62" y1="288" x2="308" y2="288"/>

<rect class="tab" x="365" y="106" width="260" height="196" rx="6"/>
<line x1="365" y1="134" x2="625" y2="134" stroke="#B4B2A9" stroke-width="0.5"/>
<text class="th" x="390" y="125">Caso</text><text class="th" x="450" y="125">Edad</text><text class="th" x="520" y="125">Ingreso</text><text class="th" x="590" y="125">Educ.</text>
<text class="t" x="390" y="153">1</text><text class="t" x="450" y="153">34</text><text class="t" x="520" y="153">520</text><text class="t" x="590" y="153">12</text>
<text class="t" x="390" y="181">2</text><text class="t" x="450" y="181">45</text><text class="t" x="590" y="181">16</text>
<g class="na"><rect x="493" y="166" width="54" height="20" rx="4"/><text x="520" y="180">NA</text></g>
<text class="t" x="390" y="209">3</text><text class="t" x="450" y="209">28</text><text class="t" x="520" y="209">410</text><text class="t" x="590" y="209">14</text>
<text class="t" x="390" y="237">4</text><text class="t" x="450" y="237">52</text><text class="t" x="590" y="237">10</text>
<g class="na"><rect x="493" y="222" width="54" height="20" rx="4"/><text x="520" y="236">NA</text></g>
<text class="t" x="390" y="265">5</text><text class="t" x="450" y="265">39</text><text class="t" x="520" y="265">680</text><text class="t" x="590" y="265">17</text>
<text class="t" x="390" y="293">6</text><text class="t" x="450" y="293">61</text><text class="t" x="520" y="293">450</text>
<g class="na"><rect x="563" y="278" width="54" height="20" rx="4"/><text x="590" y="292">NA</text></g>

<line x1="185" y1="304" x2="185" y2="326" stroke="#888780" stroke-width="1.5"/>
<line x1="495" y1="304" x2="495" y2="326" stroke="#888780" stroke-width="1.5"/>

<g class="res"><rect x="40" y="330" width="290" height="96" rx="8"/>
<text class="th" x="185" y="369">n = 3 en todas las correlaciones</text>
<text class="ts" x="185" y="394">Se descartan 3 de 6 casos</text></g>
<g class="res"><rect x="350" y="330" width="290" height="96" rx="8"/>
<text class="th" x="495" y="359">Edad – Ingreso: n = 4</text>
<text class="th" x="495" y="383">Edad – Educ.: n = 5</text>
<text class="th" x="495" y="407">Ingreso – Educ.: n = 3</text></g>
</svg>
