<div id="practicos-sidebar-hover-zone"></div>

<button
  id="practicos-sidebar-toggle"
  type="button"
  aria-label="Ocultar menú de prácticos"
  title="Ocultar menú"
>
  <i class="bi bi-chevron-left"></i>
</button>

<script>
document.addEventListener("DOMContentLoaded", function () {

  /* ========================================================
     ELEMENTOS
     ======================================================== */

  const esPracticos =
    window.location.pathname.includes("/assignment/");

  const boton =
    document.getElementById("practicos-sidebar-toggle");

  const zona =
    document.getElementById("practicos-sidebar-hover-zone");

  const sidebar =
    document.getElementById("quarto-sidebar");

  if (!esPracticos || !sidebar || !boton || !zona) {

    if (boton) {
      boton.style.display = "none";
    }

    if (zona) {
      zona.style.display = "none";
    }

    return;
  }


  const body = document.body;

  let abiertoTemporalmente = false;
  let temporizadorCierre = null;


  /* ========================================================
     POSICIÓN DE LA PESTAÑITA
     ======================================================== */

  function actualizarPosicion() {

    const cerrado =
      body.classList.contains(
        "practicos-sidebar-cerrado"
      );

    if (cerrado) {

      /*
       * Menú cerrado:
       * la pestañita queda en el borde izquierdo
       * de la pantalla.
       */
      boton.style.left = "0px";

    } else {

      /*
       * IMPORTANTE:
       * usamos offsetWidth en vez de
       * getBoundingClientRect().right.
       *
       * De esta forma la posición no depende
       * del transform de la animación.
       */
      const anchoSidebar = sidebar.offsetWidth;

      /*
       * -2 px hace que quede ligeramente
       * montada sobre el borde del menú,
       * evitando una pequeña separación visual.
       */
      boton.style.left =
        (anchoSidebar - 2) + "px";
    }
  }


  /* ========================================================
     ACTUALIZAR ICONO
     ======================================================== */

  function mostrarIconoAbierto() {

    boton.innerHTML =
      '<i class="bi bi-chevron-left"></i>';

    boton.setAttribute(
      "aria-label",
      "Ocultar menú de prácticos"
    );

    boton.title =
      "Ocultar menú";
  }


  function mostrarIconoCerrado() {

    boton.innerHTML =
      '<i class="bi bi-chevron-right"></i>';

    boton.setAttribute(
      "aria-label",
      "Mostrar menú de prácticos"
    );

    boton.title =
      "Mostrar menú";
  }


  /* ========================================================
     MOSTRAR SIDEBAR
     ======================================================== */

  function mostrarSidebar(temporal = false) {

    clearTimeout(temporizadorCierre);

    body.classList.remove(
      "practicos-sidebar-cerrado"
    );

    mostrarIconoAbierto();

    abiertoTemporalmente = temporal;

    requestAnimationFrame(function () {
      actualizarPosicion();
    });
  }


  /* ========================================================
     OCULTAR SIDEBAR
     ======================================================== */

  function ocultarSidebar(guardar = false) {

    clearTimeout(temporizadorCierre);

    body.classList.add(
      "practicos-sidebar-cerrado"
    );

    mostrarIconoCerrado();

    abiertoTemporalmente = false;

    if (guardar) {

      localStorage.setItem(
        "practicos-sidebar",
        "cerrado"
      );
    }

    requestAnimationFrame(function () {
      actualizarPosicion();
    });
  }


  /* ========================================================
     CLICK EN LA PESTAÑITA
     ======================================================== */

/* ========================================================
   CLICK EN LA PESTAÑITA
   ======================================================== */

boton.addEventListener("click", function () {

  clearTimeout(temporizadorCierre);

  const cerrado =
    body.classList.contains(
      "practicos-sidebar-cerrado"
    );

  /*
   * Si está cerrado:
   * un clic lo abre permanentemente.
   */
  if (cerrado) {

    mostrarSidebar(false);

    localStorage.setItem(
      "practicos-sidebar",
      "abierto"
    );

  } else {

    /*
     * Si está visible, ya sea porque:
     * - estaba abierto normalmente, o
     * - apareció temporalmente mediante hover,
     *
     * un solo clic lo cierra.
     */
    ocultarSidebar(true);
  }

});
  /* ========================================================
     HOVER EN EL BORDE IZQUIERDO
     ======================================================== */

  zona.addEventListener("mouseenter", function () {

    clearTimeout(temporizadorCierre);

    const cerrado =
      body.classList.contains(
        "practicos-sidebar-cerrado"
      );

    if (cerrado) {

      /*
       * Lo mostramos temporalmente,
       * sin cambiar la preferencia guardada.
       */
      mostrarSidebar(true);
    }
  });


  /* ========================================================
     MOUSE SOBRE EL SIDEBAR
     ======================================================== */

  sidebar.addEventListener("mouseenter", function () {

    clearTimeout(temporizadorCierre);
  });


  /* ========================================================
     SALIR DEL SIDEBAR
     ======================================================== */

  sidebar.addEventListener("mouseleave", function () {

    /*
     * Solo cerramos automáticamente
     * si fue abierto mediante hover.
     */
    if (!abiertoTemporalmente) {
      return;
    }

    temporizadorCierre =
      setTimeout(function () {

        ocultarSidebar(false);

      }, 500);
  });


  /* ========================================================
     SI EL MOUSE ENTRA EN EL BOTÓN
     ======================================================== */

  boton.addEventListener("mouseenter", function () {

    clearTimeout(temporizadorCierre);
  });


  /* ========================================================
     ESTADO INICIAL
     ======================================================== */

  const estadoGuardado =
    localStorage.getItem(
      "practicos-sidebar"
    );

  if (estadoGuardado === "cerrado") {

    ocultarSidebar(false);

  } else {

    mostrarSidebar(false);
  }


  /* ========================================================
     REAJUSTAR AL CAMBIAR TAMAÑO DE VENTANA
     ======================================================== */

  window.addEventListener(
    "resize",
    actualizarPosicion
  );


  /* ========================================================
     REAJUSTAR AL TERMINAR LA ANIMACIÓN

     Esto evita que después de abrir/cerrar
     la flecha termine dentro del sidebar.
     ======================================================== */

  sidebar.addEventListener(
    "transitionend",
    actualizarPosicion
  );


  /* También esperamos el cambio de la grilla de Quarto */

  const contenido =
    document.getElementById("quarto-content");

  if (contenido) {

    contenido.addEventListener(
      "transitionend",
      actualizarPosicion
    );
  }


  /* ========================================================
     AJUSTE FINAL DESPUÉS DE CARGAR
     ======================================================== */

  requestAnimationFrame(function () {

    requestAnimationFrame(function () {

      actualizarPosicion();

    });

  });

});
</script>
